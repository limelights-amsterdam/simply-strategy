<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Figure vocabulary</title><style>:root{--ink:#0A0A0A;--paper:#FFFFFF;--muted:#6B6B6B;--rule:#C9C9C9;
--sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
--serif:ui-serif,"Iowan Old Style",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);padding:3rem 1.5rem;max-width:34rem;margin:0 auto;line-height:1.6}
h1{font-size:2rem;font-weight:400;margin-bottom:.5rem}
.lede{color:var(--muted);font-family:var(--sans);font-size:.875rem;margin-bottom:3rem;line-height:1.5}
section{margin-bottom:3.5rem}
h2{font-family:var(--sans);font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-top:1px solid var(--rule);padding-top:.9rem;margin-bottom:1.5rem}
figure svg{display:block;max-width:100%;height:auto}
figcaption{font-family:var(--sans);font-size:.8125rem;color:var(--muted);margin-top:1rem;line-height:1.45}
.hero{font-family:var(--sans);font-weight:300;font-size:clamp(4rem,10vw,9rem);line-height:.9;letter-spacing:-.04em}
@media print{@page{size:A4;margin:18mm}body{max-width:none;padding:0}section{break-inside:avoid}figcaption{color:#000}}</style></head><body><h1>Figure vocabulary</h1><p class="lede">Six figures, one ink. The renderer picks from these and fills in numbers. It does not invent a seventh.</p><section><h2>hero</h2><figure><div class="hero">95</div><figcaption>One number, alone. Sans, never serif: a display serif at this size reads as decoration rather than as a fact.</figcaption></figure></section><section><h2>hundred</h2><figure><svg viewBox="0 0 205 205" width="205" height="205" role="img" aria-label="95 of every 100"><circle cx="8" cy="8" r="6" fill="#0A0A0A"/><circle cx="29" cy="8" r="6" fill="#0A0A0A"/><circle cx="50" cy="8" r="6" fill="#0A0A0A"/><circle cx="71" cy="8" r="6" fill="#0A0A0A"/><circle cx="92" cy="8" r="6" fill="#0A0A0A"/><circle cx="113" cy="8" r="6" fill="#0A0A0A"/><circle cx="134" cy="8" r="6" fill="#0A0A0A"/><circle cx="155" cy="8" r="6" fill="#0A0A0A"/><circle cx="176" cy="8" r="6" fill="#0A0A0A"/><circle cx="197" cy="8" r="6" fill="#0A0A0A"/><circle cx="8" cy="29" r="6" fill="#0A0A0A"/><circle cx="29" cy="29" r="6" fill="#0A0A0A"/><circle cx="50" cy="29" r="6" fill="#0A0A0A"/><circle cx="71" cy="29" r="6" fill="#0A0A0A"/><circle cx="92" cy="29" r="6" fill="#0A0A0A"/><circle cx="113" cy="29" r="6" fill="#0A0A0A"/><circle cx="134" cy="29" r="6" fill="#0A0A0A"/><circle cx="155" cy="29" r="6" fill="#0A0A0A"/><circle cx="176" cy="29" r="6" fill="#0A0A0A"/><circle cx="197" cy="29" r="6" fill="#0A0A0A"/><circle cx="8" cy="50" r="6" fill="#0A0A0A"/><circle cx="29" cy="50" r="6" fill="#0A0A0A"/><circle cx="50" cy="50" r="6" fill="#0A0A0A"/><circle cx="71" cy="50" r="6" fill="#0A0A0A"/><circle cx="92" cy="50" r="6" fill="#0A0A0A"/><circle cx="113" cy="50" r="6" fill="#0A0A0A"/><circle cx="134" cy="50" r="6" fill="#0A0A0A"/><circle cx="155" cy="50" r="6" fill="#0A0A0A"/><circle cx="176" cy="50" r="6" fill="#0A0A0A"/><circle cx="197" cy="50" r="6" fill="#0A0A ="6" fill="#0A0A0A"/><circle cx="71" cy="155" r="6" fill="#0A0A0A"/><circle cx="92" cy="155" r="6" fill="#0A0A0A"/><circle cx="113" cy="155" r="6" fill="#0A0A0A"/><circle cx="134" cy="155" r="6" fill="#0A0A0A"/><circle cx="155" cy="155" r="6" fill="#0A0A0A"/><circle cx="176" cy="155" r="6" fill="#0A0A0A"/><circle cx="197" cy="155" r="6" fill="#0A0A0A"/><circle cx="8" cy="176" r="6" fill="#0A0A0A"/><circle cx="29" cy="176" r="6" fill="#0A0A0A"/><circle cx="50" cy="176" r="6" fill="#0A0A0A"/><circle cx="71" cy="176" r="6" fill="#0A0A0A"/><circle cx="92" cy="176" r="6" fill="#0A0A0A"/><circle cx="113" cy="176" r="6" fill="#0A0A0A"/><circle cx="134" cy="176" r="6" fill="#0A0A0A"/><circle cx="155" cy="176" r="6" fill="#0A0A0A"/><circle cx="176" cy="176" r="6" fill="#0A0A0A"/><circle cx="197" cy="176" r="6" fill="#0A0A0A"/><circle cx="8" cy="197" r="6" fill="#0A0A0A"/><circle cx="29" cy="197" r="6" fill="#0A0A0A"/><circle cx="50" cy="197" r="6" fill="#0A0A0A"/><circle cx="71" cy="197" r="6" fill="#0A0A0A"/><circle cx="92" cy="197" r="6" fill="#0A0A0A"/><circle cx="113" cy="197" r="6" fill="none" stroke="#0A0A0A" stroke-width="1"/><circle cx="134" cy="197" r="6" fill="none" stroke="#0A0A0A" stroke-width="1"/><circle cx="155" cy="197" r="6" fill="none" stroke="#0A0A0A" stroke-width="1"/><circle cx="176" cy="197" r="6" fill="none" stroke="#0A0A0A" stroke-width="1"/><circle cx="197" cy="197" r="6" fill="none" stroke="#0A0A0A" stroke-width="1"/></svg><figcaption>95 of every 100 euros spent in 2025 is still spent in 2028</figcaption></figure></section><section><h2>gap</h2><figure><svg viewBox="0 0 430 84" width="430" height="84" role="img" aria-label="promise 50m, delivered 5m"><line x1="0" y1="0" x2="0" y2="84" stroke="#C9C9C9" stroke-width="1"/><rect x="1" y="4" width="280" height="24" rx="4" fill="none" stroke="#0A0A0A" stroke-width="1.5"/><text x="292" y="21" font-size="13" font-family="sans-serif" fill="#0A0A0A">promise 50m</text><rect x="1" y="52" width="28" height="24" rx="4" fill="#0A0A0A"/><text x="40" y="69" font-size="13" font-family="sans-serif" fill="#0A0A0A">delivered 5m</text></svg><figcaption>Halving needs 50m to go. The plan removes 5m</figcaption></figure></section><section><h2>people</h2><figure><svg viewBox="0 0 168 68" width="168" height="68" role="img" aria-label="1 in 3"><circle cx="18" cy="14" r="10" fill="#0A0A0A"/><path d="M2 62 v-14 a16 16 0 0 1 32 0 v14 z" fill="#0A0A0A"/><circle cx="72" cy="14" r="10" fill="none" stroke="#0A0A0A" stroke-width="1.5"/><path d="M56 62 v-14 a16 16 0 0 1 32 0 v14 z" fill="none" stroke="#0A0A0A" stroke-width="1.5"/><circle cx="126" cy="14" r="10" fill="none" stroke="#0A0A0A" stroke-width="1.5"/><path d="M110 62 v-14 a16 16 0 0 1 32 0 v14 z" fill="none" stroke="#0A0A0A" stroke-width="1.5"/></svg><figcaption>One person in three leaves by 2030</figcaption></figure></section><section><h2>order</h2><figure><svg viewBox="0 0 430 56" width="430" height="56" role="img" aria-label="People trust the site then Ask 200 buyers then 15 September"><line x1="10" y1="20" x2="420" y2="20" stroke="#C9C9C9" stroke-width="1"/><circle cx="10" cy="20" r="5" fill="#0A0A0A"/><text x="10" y="46" font-size="13" font-family="sans-serif" text-anchor="start" fill="#0A0A0A">People trust the site</text><circle cx="215" cy="20" r="5" fill="#0A0A0A"/><text x="215" y="46" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#0A0A0A">Ask 200 buyers</text><circle cx="420" cy="20" r="5" fill="#0A0A0A"/><text x="420" y="46" font-size="13" font-family="sans-serif" text-anchor="end" fill="#0A0A0A">15 September</text></svg><figcaption>The bet, left to right</figcaption></figure></section><section><h2>against</h2><figure><svg viewBox="0 0 430 78" width="430" height="78" role="img" aria-label="HR: headcount stays flat against Sales: we need more people"><defs><pattern id="h45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#0A0A0A" stroke-width="1.5"/></pattern></defs><line x1="215" y1="4" x2="215" y2="52" stroke="#C9C9C9" stroke-width="1"/><rect x="20" y="16" width="168" height="24" fill="#0A0A0A"/><path d="M188 16 l20 12 l-20 12 z" fill="#0A0A0A"/><rect x="242" y="16" width="168" height="24" fill="url(#h45)" stroke="#0A0A0A" stroke-width="1"/><path d="M242 16 l-20 12 l20 12 z" fill="url(#h45)" stroke="#0A0A0A" stroke-width="1"/><text x="20" y="66" font-size="13" font-family="sans-serif" fill="#0A0A0A">HR: headcount stays flat</text><text x="410" y="66" font-size="13" font-family="sans-serif" text-anchor="end" fill="#0A0A0A">Sales: we need more people</text></svg><figcaption>Two documents that cannot both be true</figcaption></figure></section></body></html>
