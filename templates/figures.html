<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Figure vocabulary</title><style>:root{--ink:#0A0A0A;--paper:#FFFFFF;--muted:#6B6B6B;--rule:#C9C9C9;
--sans:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
--serif:ui-serif,"Iowan Old Style",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);padding:3rem 1.5rem;max-width:34rem;margin:0 auto;line-height:1.6}
h1{font-size:2rem;font-weight:400;margin-bottom:.5rem}
.lede{color:var(--muted);font-family:var(--sans);font-size:.875rem;margin-bottom:3rem;line-height:1.5}
section{margin-bottom:3.5rem}
h2{font-family:var(--sans);font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-top:1px solid var(--rule);padding-top:.9rem;margin-bottom:1.5rem}
figure svg{display:block;max-width:100%;height:auto}
figcaption{font-family:var(--sans);font-size:.8125rem;color:var(--muted);margin-top:1rem;line-height:1.45}
.hero{font-family:var(--sans);font-weight:300;font-size:clamp(4rem,10vw,9rem);line-height:.9;letter-spacing:-.04em}
@media print{@page{size:A4;margin:18mm}body{max-width:none;padding:0}section{break-inside:avoid}figcaption{color:#000}}</style></head><body><h1>Figure vocabulary</h1><p class="lede">Six figures, one ink. The renderer picks from these and fills in numbers. It does not invent a seventh.</p><section><h2>hero</h2><figure><div class="hero">95</div><figcaption>One number, alone. Sans, never serif.</figcaption></figure></section><section><h2>gap</h2><figure><svg viewBox="0 0 420 158" role="img" aria-label="two sizes for one cut"><rect x="0" y="0" width="420" height="158" fill="#F4F4F5"/><rect x="26" y="42" width="300" height="30" fill="#0A0A0A"/><text x="26" y="32" font-size="13" font-family="sans-serif" font-weight="700" fill="#0A0A0A">500 cut, 1400 to 900</text><rect x="26" y="100" width="252" height="30" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="26" y="90" font-size="13" font-family="sans-serif" font-weight="700" fill="#0A0A0A">420 cut, at about 30 percent</text><line x1="278" y1="100" x2="278" y2="146" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="3 3"/><line x1="326" y1="42" x2="326" y2="146" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="3 3"/><text x="336" y="122" font-size="11" font-family="sans-serif" fill="#5A5A5A">80 people</text></svg><figcaption>Promise against delivery. The empty space between the bars is the finding.</figcaption></figure></section><section><h2>overlap</h2><figure><svg viewBox="0 0 420 250" role="img" aria-label="the cut and the growth need the same people"><rect x="0" y="0" width="420" height="250" fill="#F4F4F5"/><circle cx="168" cy="104" r="72" fill="none" stroke="#0A0A0A" stroke-width="2"/><circle cx="252" cy="104" r="72" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="5 4"/><text x="210" y="98" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">the same</text><text x="210" y="116" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">people</text><line x1="118" y1="186" x2="118" y2="200" stroke="#D4D4D8" stroke-width="1"/><line x1="302" y1="186" x2="302" y2="200" stroke="#D4D4D8" stroke-width="1"/><text x="118" y="216" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">The cut</text><text x="118" y="234" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#5A5A5A">field engineers, L1 and L2</text><text x="302" y="216" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">The growth</text><text x="302" y="234" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#5A5A5A">in-home, security</text></svg><figcaption>Only when the overlap <b>is</b> the finding. Labels sit outside the circles.</figcaption></figure></section><section><h2>timeline</h2><figure><svg viewBox="0 0 420 120" role="img" aria-label="four years with no dates"><rect x="0" y="0" width="420" height="120" fill="#F4F4F5"/><line x1="34" y1="60" x2="386" y2="60" stroke="#0A0A0A" stroke-width="2"/><circle cx="34" cy="60" r="7" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="34" y="88" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">2026</text><text x="34" y="106" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#5A5A5A">no date</text><circle cx="151" cy="60" r="7" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="151" y="88" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">2027</text><text x="151" y="106" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#5A5A5A">no date</text><circle cx="268" cy="60" r="7" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="268" y="88" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">2028</text><text x="268" y="106" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#5A5A5A">no date</text><circle cx="386" cy="60" r="7" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="386" y="88" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">2030</text><text x="386" y="106" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#5A5A5A">no date</text><text x="210" y="30" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#0A0A0A">Four years, four empty marks</text></svg><figcaption>Four marks, all empty. A missing date says more as a blank than as a sentence.</figcaption></figure></section><section><h2>eisenhower</h2><figure><svg viewBox="0 0 480 300" role="img" aria-label="gaps placed by what they stop"><rect x="0" y="0" width="480" height="300" fill="#F4F4F5"/><text x="180" y="28" font-size="10" font-family="sans-serif" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#5A5A5A">STOPS THE DECISION</text><text x="370" y="28" font-size="10" font-family="sans-serif" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#5A5A5A">STOPS THE WORK</text><line x1="86" y1="38" x2="464" y2="38" stroke="#D4D4D8" stroke-width="1"/><text x="74" y="90" font-size="10" font-family="sans-serif" font-weight="700" letter-spacing="0.08em" text-anchor="end" fill="#5A5A5A">MUST</text><text x="74" y="104" font-size="10" font-family="sans-serif" font-weight="700" letter-spacing="0.08em" text-anchor="end" fill="#5A5A5A">SOLVE</text><text x="74" y="204" font-size="10" font-family="sans-serif" font-weight="700" letter-spacing="0.08em" text-anchor="end" fill="#5A5A5A">IMPOR-</text><text x="74" y="218" font-size="10" font-family="sans-serif" font-weight="700" letter-spacing="0.08em" text-anchor="end" fill="#5A5A5A">TANT</text><line x1="275" y1="42" x2="275" y2="284" stroke="#D4D4D8" stroke-width="1"/><line x1="86" y1="170" x2="464" y2="170" stroke="#D4D4D8" stroke-width="1"/><circle cx="94" cy="78" r="3" fill="#0A0A0A"/><text x="104" y="82" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">Who is in the room</text><circle cx="94" cy="98" r="3" fill="#0A0A0A"/><text x="104" y="102" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">What the step-up costs</text><circle cx="94" cy="118" r="3" fill="#0A0A0A"/><text x="104" y="122" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">Who decides, by when</text><circle cx="94" cy="138" r="3" fill="#0A0A0A"/><text x="104" y="142" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">Any amount at all</text><circle cx="285" cy="192.0" r="3" fill="#0A0A0A"/><text x="295" y="196.0" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">Which grades leave</text><circle cx="285" cy="212.0" r="3" fill="#0A0A0A"/><text x="295" y="216.0" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">Who signs the partner deal</text><circle cx="285" cy="232.0" r="3" fill="#0A0A0A"/><text x="295" y="236.0" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">The reskilling budget</text><circle cx="285" cy="252.0" r="3" fill="#0A0A0A"/><text x="295" y="256.0" font-size="11.5" font-family="sans-serif" fill="#0A0A0A">Revenue today and in 2030</text></svg><figcaption>Every gap placed by what it stops. The top-left quadrant is the agenda.</figcaption></figure></section></body></html>
